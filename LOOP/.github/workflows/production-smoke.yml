name: LOOP production smoke monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loop-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 26.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0

      - name: Explain missing monitoring configuration
        if: ${{ vars.LOOP_PRODUCTION_URL == '' }}
        run: echo 'Skipped smoke checks. Add the GitHub Actions repository variable LOOP_PRODUCTION_URL to enable production monitoring.'

      - name: Check production deployment
        if: ${{ vars.LOOP_PRODUCTION_URL != '' }}
        env:
          LOOP_PRODUCTION_URL: ${{ vars.LOOP_PRODUCTION_URL }}
        run: node scripts/vercel-smoke-test.js

      - name: Send optional failure notification
        if: ${{ failure() }}
        env:
          LOOP_ALERT_WEBHOOK: ${{ secrets.LOOP_ALERT_WEBHOOK }}
          LOOP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOOP_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$LOOP_ALERT_WEBHOOK" ]; then
            echo 'No alert webhook configured. The failed run remains visible in GitHub Actions.'
            exit 0
          fi
          node - <<'NODE'
          (async () => {
            const message = `LOOP production smoke test failed for ${process.env.LOOP_REPOSITORY}. See ${process.env.LOOP_RUN_URL}`;
            const response = await fetch(process.env.LOOP_ALERT_WEBHOOK, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ text: message }),
            });
            if (!response.ok) {
              process.stderr.write(`Alert webhook returned HTTP ${response.status}.\n`);
              process.exit(1);
            }
            console.log('Failure notification delivered.');
          })().catch((error) => {
            process.stderr.write(`Alert notification failed: ${error.message}\n`);
            process.exit(1);
          });
          NODE
